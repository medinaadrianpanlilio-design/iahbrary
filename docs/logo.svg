<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Iahbrary</title>
  <desc id="desc">Iahbrary wordmark: an open book with an upward spark, followed by the tagline Read like you train.</desc>
  <defs>
    <linearGradient id="bg" x1="20" y1="20" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DD3FC"/>
      <stop offset="0.55" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="book" x1="60" y1="60" x2="120" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="718" height="178" rx="28" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="20" y="20" width="140" height="140" rx="36" fill="url(#bg)"/>
  <rect x="20" y="20" width="140" height="140" rx="36" stroke="#FFFFFF" stroke-opacity="0.38" stroke-width="2"/>

  <path d="M52 92c14-6 27-6 38 0v34c-11-6-24-6-38 0V92Z" fill="url(#book)" filter="url(#glow)"/>
  <path d="M128 92c-14-6-27-6-38 0v34c11-6 24-6 38 0V92Z" fill="url(#book)" filter="url(#glow)"/>
  <path d="M90 92v34" stroke="#60A5FA" stroke-width="3" stroke-linecap="round"/>
  <path d="M90 48l10 14h-6v12h-8V62h-6l10-14Z" fill="#FFFFFF" filter="url(#glow)"/>

  <text x="190" y="94" fill="#0F172A" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="800" letter-spacing="-2">Iahbrary</text>
  <text x="194" y="128" fill="#64748B" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" letter-spacing="4">READ LIKE YOU TRAIN</text>
</svg>
