name: Build iOS IPA (For Sideloading)

on:
  # Manual builds only: macOS runners are expensive, and this is a showcase
  # artifact rather than a release pipeline.
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Select Xcode and Verify Toolchain
        run: |
          set -euxo pipefail
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app || true

          # Select the newest installed Xcode version
          NEWEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$NEWEST_XCODE" ]; then
            echo "Selecting $NEWEST_XCODE"
            sudo xcode-select -s "$NEWEST_XCODE/Contents/Developer"
          fi

          xcodebuild -version
          swift --version
          xcode-select -p
          pod --version

      - name: 3. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 4. Install Dependencies
        run: npm ci

      - name: 4b. Ensure Swift Tools Compatibility
        run: |
          # If the selected Xcode has Swift < 6.2 (e.g. Swift 6.1), clamp swift-tools-version in node_modules to avoid tool version mismatch
          SWIFT_VER=$(swift --version | head -n 1)
          echo "Active Swift: $SWIFT_VER"
          if swift --version | grep -q "version 6.1"; then
            echo "Swift 6.1 detected. Clamping swift-tools-version: 6.2 to 6.1 in node_modules..."
            find node_modules -name "Package.swift" -exec sed -i '' 's/swift-tools-version: 6.2/swift-tools-version: 6.1/g' {} +
          fi

      - name: 5. Generate Native iOS Project (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: 5b. Install CocoaPods Dependencies
        run: |
          echo "Ensuring CocoaPods dependencies are installed..."
          cd ios
          pod install
          cd ..

      - name: 6. Build Release Archive (Unsigned)
        run: |
          # Locate workspace reliably (avoid BSD find parameter ordering bugs)
          WORKSPACE=$(ls -d ios/*.xcworkspace 2>/dev/null | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            WORKSPACE=$(find ios -maxdepth 2 -name "*.xcworkspace" 2>/dev/null | head -n 1)
          fi

          echo "Found workspace: $WORKSPACE"

          if [ -z "$WORKSPACE" ] || [ ! -d "$WORKSPACE" ]; then
            echo "::error::No .xcworkspace found in ios directory!"
            echo "Contents of ios directory:"
            ls -la ios || true
            exit 1
          fi

          # Target the main application scheme
          SCHEME="Iahbrary"
          echo "Using scheme: $SCHEME"

          mkdir -p build

          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            SKIP_INSTALL=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: 7. Package App into IPA
        run: |
          mkdir -p build/Payload

          # Locate the .app bundle inside the archive or build products
          APP_PATH=$(find build -name "*.app" -type d 2>/dev/null | head -n 1)
          echo "Packaging application from: $APP_PATH"

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "::error::No .app bundle found in build directory!"
            echo "Contents of build directory:"
            find build -maxdepth 4 || true
            exit 1
          fi

          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r -9 Iahbrary.ipa Payload
          ls -lh Iahbrary.ipa

      - name: 8. Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Iahbrary-Unsigned-IPA
          path: build/Iahbrary.ipa
          retention-days: 7
